spring:
  application:
    name: Recycling

  datasource:
    url: jdbc:mysql://localhost:3306/recycling
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Учебный ключ. Для реального проекта хранить в переменной окружения JWT_SECRET.
  secret: ${JWT_SECRET:Recycling-LR5-Development-Secret-Key-2026-Only}
  access-minutes: 15
  refresh-days: 7
